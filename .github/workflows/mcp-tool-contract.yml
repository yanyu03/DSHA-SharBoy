name: MCP Tool Contract Safety
on:
  pull_request:
    paths:
      - 'skills/reverse-engineer-anything/tools/rea/bridge/android/ReaJadxBridge.java'
      - 'scripts/mcp_stdio_smoke.py'
      - 'scripts/test_mcp_contract.py'
      - '.github/workflows/mcp-tool-contract.yml'
  push:
    branches: [main]
    paths:
      - 'skills/reverse-engineer-anything/tools/rea/bridge/android/ReaJadxBridge.java'
      - 'scripts/mcp_stdio_smoke.py'
      - 'scripts/test_mcp_contract.py'
      - '.github/workflows/mcp-tool-contract.yml'
jobs:
  static-and-probe-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static annotation contract and mock probe
        run: python3 -m unittest discover -s scripts -p 'test_mcp_contract.py' -v
